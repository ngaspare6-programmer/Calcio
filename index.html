<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calcio">
<meta name="theme-color" content="#F2F2F4">
<title>Calcio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Basic (scelta di Gaspare, 8/11): bianco e nero, solo Inter, colore solo dove dice qualcosa.
     Giorno e notte come nell'elettricista: il tasto sole / luna in alto cambia solo questi valori. */
  :root{
    --bg:#F2F2F4; --ink:#111111; --muted:#6B6B70;
    --carta:#fff; --q:#F6F6F7; --linea:#E6E6E8; --traccia:#E6E6E8;
    --chip:#EEEEF0; --chip-on:#111111; --su-chip-on:#fff;
    --casa:#111111; --fuori:#A8A8AE; --pari:#DCDCE0;
    --barra:#111111;                      /* barrette delle percentuali */
    --pieno:#166534;                      /* tasto Cerca: uguale di giorno e di notte */
    --vinta:#166534; --su-vinta:#fff; --persa:#C62828;
    --campo:#fff; --campo-bordo:#DCDCE0;
  }
  :root[data-tema="notte"]{
    --bg:#0E0E10; --ink:#F2F2F4; --muted:#9A9AA0;
    --carta:#1C1C1E; --q:#242427; --linea:#2C2C2F; --traccia:#2E2E31;
    --chip:#2C2C2F; --chip-on:#F2F2F4; --su-chip-on:#111111;
    --casa:#F2F2F4; --fuori:#76767C; --pari:#3A3A3E;
    --barra:#F2F2F4;
    --vinta:#22C55E; --su-vinta:#052E16; --persa:#F87171;   /* sul nero serve il verde luminoso, come nell'elettricista */
    --campo:#1C1C1E; --campo-bordo:#3A3A3E;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100dvh;background:var(--bg)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .serif{font-weight:700;letter-spacing:-.02em}
  .col{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;min-height:36px}
  .top .destra{display:flex;align-items:center;gap:4px}
  .tema{width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
  .tema svg{width:20px;height:20px}
  .tema .luna, [data-tema="notte"] .tema .sole{display:none}
  [data-tema="notte"] .tema .luna{display:block}
  .top .prova{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--chip);padding:4px 9px;border-radius:999px}


  /* ricerca */
  .cerca{display:flex;gap:8px;margin:10px 0 18px}
  .cerca input{flex:1;min-width:0;font:inherit;font-size:16px;padding:13px 14px;border-radius:14px;border:1px solid var(--campo-bordo);background:var(--campo);color:var(--ink);outline:none}
  .cerca input:focus{border-color:var(--pieno);box-shadow:0 0 0 3px rgba(34,197,94,.22)}
  .cerca button{background:var(--pieno);color:#fff;font-weight:700;padding:0 18px;border-radius:14px}

  /* testata */
  .testa{text-align:center;margin-bottom:14px}
  .testa .info{font-size:13px;color:var(--muted)}
  .squadre{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:8px 0 4px}
  .sq{font-size:30px;line-height:1.05}
  .sq small{display:block;font-family:Inter,sans-serif;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .vs{font-size:13px;color:var(--muted)}
  .pt{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:6px}
  .pt.c{background:var(--casa);box-shadow:inset 0 0 0 1px var(--linea)} .pt.f{background:var(--fuori)}

  .carta{background:var(--carta);border-radius:16px;padding:14px;margin-bottom:10px}
  .lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

  /* 1 X 2 */
  .tre{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px}
  .tre i{display:block}
  .tre .c{background:var(--casa)} .tre .x{background:var(--pari)} .tre .f{background:var(--fuori)}
  .tre-num{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;text-align:center}
  .tre-num div{font-size:12px;color:var(--muted)}
  .tre-num b{display:block;font-weight:700;letter-spacing:-.02em;font-size:30px;line-height:1.1;color:var(--ink);opacity:.45}
  .tre-num .top1 b{opacity:1}

  /* scenari: pillole delle categorie, spiegazione, quadratini */
  .cat{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 10px;padding:0 14px;scrollbar-width:none}
  .cat::-webkit-scrollbar{display:none}
  .chip{flex:none;background:var(--chip);font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;white-space:nowrap}
  .chip.on{background:var(--chip-on);color:var(--su-chip-on)}
  .spiega{font-size:13px;line-height:1.45;padding:9px 12px;border-left:3px solid var(--barra);background:var(--q);border-radius:4px 10px 10px 4px;margin-bottom:10px}
  .spiega b{font-weight:700}
  .griglia{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .q{background:var(--q);border-radius:14px;padding:12px}
  .q b{display:block;font-weight:700;letter-spacing:-.02em;font-size:28px;line-height:1.1}
  .q span{display:block;font-size:13px;font-weight:600;line-height:1.3;margin-top:2px}
  .q small{display:block;font-size:12px;line-height:1.35;color:var(--muted);margin-top:3px}
  .q .sigla{font-style:normal;display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;background:var(--chip);border-radius:6px;padding:1px 6px;margin-top:6px}
  .q .barretta{height:4px;border-radius:4px;background:var(--traccia);margin-top:8px;overflow:hidden}
  .q .barretta i{display:block;height:100%;background:var(--barra)}
  .come{font-size:12px;color:var(--muted);margin-top:10px}

  /* confronto a specchio */
  .specchio{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px 10px;padding:8px 0;border-top:1px solid var(--linea)}
  .specchio:first-of-type{border-top:0}
  .specchio .v{font-weight:700;font-size:15px;white-space:nowrap}
  .specchio .v.d{text-align:right}
  .specchio .nome{font-size:12px;color:var(--muted);text-align:center;min-width:96px}
  .barre{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .barre div{height:5px;border-radius:5px;background:var(--traccia);overflow:hidden;display:flex}
  .barre div:first-child{justify-content:flex-end}
  .barre .c{background:var(--casa)} .barre .f{background:var(--fuori)}
  .intest{display:grid;grid-template-columns:1fr 1fr;font-size:12px;font-weight:600;margin-bottom:4px}
  .intest div:last-child{text-align:right}

  /* forma */
  .forma{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--linea)}
  .forma:first-of-type{border-top:0}
  .forma .chi{font-weight:600;font-size:15px}
  .pallini{display:flex;gap:5px}
  .pallini span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
  .pallini .V{background:var(--vinta);color:var(--su-vinta)}
  .pallini .P{background:var(--pari);color:var(--ink)}
  .pallini .S{color:var(--persa);box-shadow:inset 0 0 0 1.5px var(--persa)}

  .dir{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-top:1px solid var(--linea)}
  .dir:first-of-type{border-top:0}
  .dir .t{color:var(--muted);width:68px;flex:none}
  .dir span:nth-child(2){flex:1}
  .dir b{font-weight:700}
  /* la giornata da toccare (versione B, scelta da Gaspare l'8/11) */
  .gtesta{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
  .gtesta .lab{margin:0}
  .gtesta button{width:36px;height:30px;font-size:20px;line-height:1;color:var(--muted);border-radius:10px}
  .gtesta button:disabled{opacity:.25}
  .giorno{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 2px}
  .riga{display:grid;grid-template-columns:44px minmax(0,1fr) 14px;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--linea)}
  .riga .o{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .riga .n{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;font-weight:600}
  .riga .n > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .riga .n em{font-style:normal;font-weight:400;color:var(--muted);font-size:13px;white-space:nowrap}
  .riga .n em b{color:var(--ink);font-weight:700}
  .riga .tre{height:5px;gap:2px;margin:6px 0 0}
  .riga .freccia{color:var(--muted);font-size:18px;line-height:1}
  .indietro{font-size:14px;font-weight:600;color:var(--muted);margin:-6px 0 10px;padding:4px 0}
  .nota{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;padding:0 10px}
  /* stati della pagina: vuota, errore, avviso */
  .vuoto{font-size:14px;color:var(--muted);line-height:1.5}
  .vuoto b{color:var(--ink)}
  .errore{border-left:3px solid var(--persa)}
  .nomi{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .nomi button{background:var(--chip);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
  .avviso{font-size:12px;color:var(--muted);text-align:center;margin:-6px 0 12px}
  .cerca button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="col" id="app"></div>
<script>
// ===== Calcio · app personale di Gaspare =====
// I dati arrivano da football-data.org passando dalla funzione Supabase "calcio-dati":
// la chiave sta solo nei segreti di Supabase. Qui sotto c'è solo l'indirizzo della funzione, che non è segreto.
const API_VERA = 'https://ifptmfihhvjudqpjboly.supabase.co/functions/v1/calcio-dati';
const qs = new URLSearchParams(location.search);
const SUL_MAC = ['127.0.0.1', 'localhost'].includes(location.hostname);
const API = (SUL_MAC && qs.get('api')) || API_VERA;          // sul Mac si può provare con una stagione finta
const VALIDITA = 30 * 60 * 1000;                              // la stagione scaricata vale 30 minuti

const $ = id => document.getElementById(id);
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const leggi = k => { try { return localStorage.getItem(k); } catch { return null; } };
const scrivi = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

// ---------- Giorno e notte (come nell'elettricista) ----------
const html = document.documentElement;
function tema(t){
  html.dataset.tema = t;
  document.querySelector('meta[name="theme-color"]').content = t === 'notte' ? '#0E0E10' : '#F2F2F4';
}
tema(leggi('calcio-tema') === 'notte' ? 'notte' : 'giorno');

// ---------- Dati ----------
async function stagione(){
  const salvata = (() => { try { return JSON.parse(leggi('calcio-stagione')); } catch { return null; } })();
  if (salvata && salvata.api === API && Date.now() - salvata.preso < VALIDITA) return salvata.dati;
  try {
    const r = await fetch(API + '?cosa=stagione');
    const d = await r.json();
    if (!r.ok || !Array.isArray(d.partite)) throw new Error(d.errore || 'Risposta strana');
    sistemaNomi(d.partite); (d.classifica || []).forEach(t => { if (t.corto) t.corto = corto(t.corto); });
    scrivi('calcio-stagione', JSON.stringify({ api: API, preso: Date.now(), dati: d }));
    return d;
  } catch (err) {
    if (salvata && salvata.api === API) return { ...salvata.dati, vecchi: true };   // meglio i dati di prima che niente
    throw new Error('Non riesco a scaricare i dati (' + err.message + '). Controlla la connessione e riprova.');
  }
}
async function diretti(id){
  try { const r = await fetch(API + '?cosa=diretti&id=' + encodeURIComponent(id)); const d = await r.json(); return Array.isArray(d.partite) ? sistemaNomi(d.partite) : []; }
  catch { return []; }
}

// Nomi più corti da leggere: "Como 1907" → "Como", "Venezia FC" → "Venezia"
const corto = s => String(s || '').replace(/\s+(FC|CFC|AC|SSC|1907|\d{4})$/i, '').replace(/^(FC|AC|AS|SS|US)\s+/i, '');
function sistemaNomi(lista){ lista.forEach(p => { [p.casa, p.fuori].forEach(t => { if (t && t.corto) t.corto = corto(t.corto); }); }); return lista; }

// ---------- Trovare le squadre da quello che scrivi ----------
const pulisci = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[^a-z0-9 ]/g, ' ').replace(/\b(18|19|20)\d\d\b/g, ' ')
  .replace(/\b(ac|as|fc|us|ss|ssc|acf|bc|calcio|football|club)\b/g, ' ').replace(/\s+/g, ' ').trim();

function squadreDi(D){
  const m = new Map();
  (D.classifica || []).forEach(t => m.set(t.id, t));
  D.partite.forEach(p => { if (!m.has(p.casa.id)) m.set(p.casa.id, p.casa); if (!m.has(p.fuori.id)) m.set(p.fuori.id, p.fuori); });
  return [...m.values()].filter(t => t.id);
}
function trova(testo, squadre){
  const n = pulisci(testo); if (!n) return null;
  let meglio = null, punti = 0;
  for (const t of squadre){
    const corto = pulisci(t.corto), nome = pulisci(t.nome), sigla = String(t.sigla || '').toLowerCase();
    let p = 0;
    if (n === corto) p = 100;
    else if (n === sigla) p = 90;
    else if (corto.startsWith(n) || n.startsWith(corto)) p = 80;
    else if ((' ' + nome + ' ').includes(' ' + n + ' ')) p = 70;
    else if (n.length >= 3 && nome.split(' ').some(w => w.startsWith(n))) p = 60;
    if (p > punti) { punti = p; meglio = t; }
  }
  return meglio;
}
const dividi = testo => String(testo).split(/\s*(?:[-–—]|\bvs\.?(?=\s)|\bcontro\b)\s*/i).map(s => s.trim()).filter(Boolean);

// ---------- I conti ----------
// Modello di Poisson: per ogni squadra si stimano i gol attesi in questa partita
// = media del campionato per chi gioca in casa (o fuori) × attacco di chi segna × difesa dell'altra.
// Attacco e difesa si contano su TUTTE le partite della squadra (casa + fuori: il doppio dei dati);
// il vantaggio di giocare in casa è uguale per tutti, quello medio del campionato.
// Con poche partite i numeri tirano verso la media: come se ogni squadra avesse K partite "medie" in più.
// K = 10: per i gol di una squadra il caso pesa quanto la bravura fino a circa 10 partite.
const K = 10;
function poisson(l, max = 10){ const a = []; let p = Math.exp(-l); for (let k = 0; k <= max; k++){ a.push(p); p = p * l / (k + 1); } return a; }
function griglia(lh, la){ const ph = poisson(lh), pa = poisson(la); return (f) => { let s = 0; for (let i = 0; i < ph.length; i++) for (let j = 0; j < pa.length; j++) if (f(i, j)) s += ph[i] * pa[j]; return s; }; }
const media = (l, f) => l.length ? l.reduce((s, x) => s + f(x), 0) / l.length : 0;
const pc = x => Math.round(x * 100);

function analizza(D, A, B){
  const fin = D.partite.filter(p => p.stato === 'FINISHED' && p.finale[0] != null && p.finale[1] != null);
  if (fin.length < 10) throw new Error('Il campionato è appena iniziato: servono almeno 10 partite giocate per fare i conti.');
  const Lh = media(fin, p => p.finale[0]), La = media(fin, p => p.finale[1]);
  const inCasa = id => fin.filter(p => p.casa.id === id), fuori = id => fin.filter(p => p.fuori.id === id);
  const hA = inCasa(A.id), aB = fuori(B.id);
  // forza(id, q, Lc, Lf): attacco e difesa della squadra rispetto alla media, con i gol di "q" (finale o intervallo)
  const forza = (id, q, Lc, Lf) => {
    const l = fin.filter(p => (p.casa.id === id || p.fuori.id === id) && p[q][0] != null && p[q][1] != null);
    const G = (Lc + Lf) / 2;                                   // gol medi di una squadra in una partita
    const fatti = l.reduce((s, p) => s + (p.casa.id === id ? p[q][0] : p[q][1]), 0);
    const subiti = l.reduce((s, p) => s + (p.casa.id === id ? p[q][1] : p[q][0]), 0);
    return { att: (fatti + K * G) / (l.length + K) / G, dif: (subiti + K * G) / (l.length + K) / G };
  };
  const fA = forza(A.id, 'finale', Lh, La), fB = forza(B.id, 'finale', Lh, La);
  const lh = Lh * fA.att * fB.dif;
  const la = La * fB.att * fA.dif;
  const P = griglia(lh, la);

  // 1 X 2 (sistemati perché facciano 100)
  let t = [pc(P((i, j) => i > j)), pc(P((i, j) => i === j)), pc(P((i, j) => i < j))];
  const diff = 100 - t[0] - t[1] - t[2]; t[t.indexOf(Math.max(...t))] += diff;

  const a = A.corto || A.nome, b = B.corto || B.nome;
  const categorie = [
    { nome:'Risultato', spiega:'<b>Come finisce la partita</b>, al fischio finale (recupero compreso).', voci:[
      { n:pc(P((i,j) => i >= j)), t:`${a} vince o pareggia`, s:`Va male solo se vince ${b}`, k:'1X' },
      { n:pc(P((i,j) => i <= j)), t:`${b} vince o pareggia`, s:`Va male solo se vince ${a}`, k:'X2' },
      { n:pc(P((i,j) => i !== j)), t:'Qualcuno vince', s:'Tutto tranne il pareggio', k:'12' },
      { n:pc(P((i,j) => i - j >= 2)), t:`${a} vince di 2+ gol`, s:'Es. 2-0, 3-1', k:'Handicap 1 (-1)' },
      { n:pc(P((i,j) => j - i >= 2)), t:`${b} vince di 2+ gol`, s:'Es. 0-2, 1-3', k:'Handicap 2 (-1)' }    ]},
    { nome:'Gol', spiega:`<b>Gol totali della partita</b>: si sommano quelli di ${e(a)} e quelli di ${e(b)}. Es. 2-1 = 3 gol.`, voci:[
      { n:pc(P((i,j) => i + j >= 1)), t:'Almeno 1 gol', s:'Tutto tranne 0-0', k:'Over 0,5' },
      { n:pc(P((i,j) => i + j >= 2)), t:'Almeno 2 gol', s:'Es. 1-1, 2-0', k:'Over 1,5' },
      { n:pc(P((i,j) => i + j >= 3)), t:'Almeno 3 gol', s:'Es. 2-1, 3-0', k:'Over 2,5' },
      { n:pc(P((i,j) => i + j >= 4)), t:'Almeno 4 gol', s:'Es. 2-2, 3-1', k:'Over 3,5' },
      { n:pc(P((i,j) => i + j <= 2)), t:'Al massimo 2 gol', s:'Es. 0-0, 1-1, 2-0', k:'Under 2,5' },
      { n:pc(P((i,j) => i + j <= 3)), t:'Al massimo 3 gol', s:'Es. 1-1, 2-1, 3-0', k:'Under 3,5' },
      { n:pc(P((i,j) => i + j >= 1 && i + j <= 3)), t:'Da 1 a 3 gol', s:'Es. 1-0, 1-1, 2-1', k:'Multigol 1-3' },
      { n:pc(P((i,j) => i + j >= 2 && i + j <= 4)), t:'Da 2 a 4 gol', s:'Es. 1-1, 2-1, 3-1', k:'Multigol 2-4' },
      { n:pc(P((i,j) => (i + j) % 2 === 0)), t:'Gol pari', s:'0, 2, 4… · es. 0-0, 1-1, 3-1', k:'Pari' },
      { n:pc(P((i,j) => (i + j) % 2 === 1)), t:'Gol dispari', s:'1, 3, 5… · es. 1-0, 2-1', k:'Dispari' }
    ]},
    { nome:'Squadre', spiega:`<b>Gol di ogni squadra, contati da soli.</b> Per esempio "${e(a)} segna" vale anche se ${e(a)} perde 1-3.`, voci:[
      { n:pc(P((i,j) => i > 0 && j > 0)), t:'Segnano tutte e due', s:'Almeno un gol a testa · es. 1-1, 2-1', k:'Gol/Gol' },
      { n:pc(P((i,j) => i === 0 || j === 0)), t:'Almeno una resta a zero', s:'Es. 1-0, 0-0, 0-2', k:'No Gol' },
      { n:pc(P((i) => i >= 1)), t:`${a} segna`, s:`Almeno un gol di ${a}`, k:'' },
      { n:pc(P((i) => i >= 2)), t:`${a} fa 2+ gol`, s:`Due o più gol di ${a}`, k:'' },
      { n:pc(P((i,j) => j >= 1)), t:`${b} segna`, s:`Almeno un gol di ${b}`, k:'' },
      { n:pc(P((i,j) => j >= 2)), t:`${b} fa 2+ gol`, s:`Due o più gol di ${b}`, k:'' },
      { n:pc(P((i,j) => j === 0)), t:`${a} non prende gol`, s:`${b} resta a zero`, k:'Porta inviolata' },
      { n:pc(P((i) => i === 0)), t:`${b} non prende gol`, s:`${a} resta a zero`, k:'Porta inviolata' }
    ]},
    { nome:'Combo', spiega:'<b>Due cose insieme:</b> devono succedere tutte e due. Per questo la percentuale è sempre più bassa di quelle prese da sole.', voci:[
      { n:pc(P((i,j) => i > j && i + j >= 3)), t:`Vince ${a} e almeno 3 gol`, s:'Es. 2-1, 3-0', k:'1 + Over 2,5' },
      { n:pc(P((i,j) => i < j && i + j >= 3)), t:`Vince ${b} e almeno 3 gol`, s:'Es. 1-2, 0-3', k:'2 + Over 2,5' },
      { n:pc(P((i,j) => i > j && j > 0)), t:`Vince ${a} e segnano tutte e due`, s:'Es. 2-1, 3-1', k:'1 + Gol/Gol' },
      { n:pc(P((i,j) => i < j && i > 0)), t:`Vince ${b} e segnano tutte e due`, s:'Es. 1-2, 1-3', k:'2 + Gol/Gol' },
      { n:pc(P((i,j) => i > 0 && j > 0 && i + j >= 3)), t:'Segnano tutte e due e almeno 3 gol', s:'Es. 2-1, 2-2', k:'Gol/Gol + Over 2,5' },
      { n:pc(P((i,j) => (i === 0 || j === 0) && i + j <= 2)), t:'Una resta a zero e al massimo 2 gol', s:'Es. 0-0, 1-0, 0-2', k:'No Gol + Under 2,5' },
      { n:pc(P((i,j) => i >= j && i + j <= 3)), t:`${a} non perde e al massimo 3 gol`, s:'Es. 1-0, 1-1, 2-1', k:'1X + Under 3,5' },
      { n:pc(P((i,j) => i <= j && i + j <= 3)), t:`${b} non perde e al massimo 3 gol`, s:'Es. 0-1, 1-1, 1-2', k:'X2 + Under 3,5' }
    ]}
  ];

  // 1º tempo: stesso modello con i risultati all'intervallo; il 2º tempo è quello che resta
  const conInt = fin.filter(p => p.intervallo[0] != null && p.intervallo[1] != null);
  if (conInt.length >= 10){
    const Lh1 = media(conInt, p => p.intervallo[0]) || .01, La1 = media(conInt, p => p.intervallo[1]) || .01;
    const iA = forza(A.id, 'intervallo', Lh1, La1), iB = forza(B.id, 'intervallo', Lh1, La1);
    const lh1 = Math.min(Lh1 * iA.att * iB.dif, lh * .9);
    const la1 = Math.min(La1 * iB.att * iA.dif, la * .9);
    const lh2 = lh - lh1, la2 = la - la1;
    const T = griglia(lh1, la1), S = griglia(lh2, la2);
    const t1 = poisson(lh1 + la1), t2 = poisson(lh2 + la2);
    let primo = 0, secondo = 0; t1.forEach((x, i) => t2.forEach((y, j) => { if (j > i) secondo += x * y; else if (i > j) primo += x * y; }));
    // Parziale/finale: risultato all'intervallo (1, X, 2) e alla fine, sommando i gol dei due tempi
    const h1 = poisson(lh1, 7), a1 = poisson(la1, 7), h2 = poisson(lh2, 7), a2 = poisson(la2, 7);
    const segno = d => d > 0 ? '1' : d === 0 ? 'X' : '2';
    const pf = {};
    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) for (let k = 0; k < 8; k++) for (let l = 0; l < 8; l++){
      const c = segno(i - j) + '/' + segno(i + k - j - l);
      pf[c] = (pf[c] || 0) + h1[i] * a1[j] * h2[k] * a2[l];
    }
    const chi = s => s === '1' ? `avanti ${a}` : s === '2' ? `avanti ${b}` : 'pari';
    const vince = s => s === '1' ? `vince ${a}` : s === '2' ? `vince ${b}` : 'pareggio';
    categorie.push({ nome:'Tempi', spiega:'<b>I due tempi presi da soli</b> (recupero compreso). Il 2º tempo conta solo i gol segnati dopo l\'intervallo: es. 1-0 all\'intervallo e 2-1 alla fine = 2 gol nel 2º tempo.', voci:[
      { n:pc(T((i,j) => i + j >= 1)), t:'Almeno 1 gol nel 1º tempo', s:'Tutto tranne 0-0 all\'intervallo', k:'Over 0,5 1ºT' },
      { n:pc(T((i,j) => i + j >= 2)), t:'Almeno 2 gol nel 1º tempo', s:'Es. 1-1, 2-0 all\'intervallo', k:'Over 1,5 1ºT' },
      { n:pc(S((i,j) => i + j >= 1)), t:'Almeno 1 gol nel 2º tempo', s:'Almeno un gol dopo l\'intervallo', k:'Over 0,5 2ºT' },
      { n:pc(S((i,j) => i + j >= 2)), t:'Almeno 2 gol nel 2º tempo', s:'Es. 0-0 all\'intervallo, 1-1 alla fine', k:'Over 1,5 2ºT' },
      { n:pc(primo), t:'Più gol nel 1º tempo', s:'Es. 2-0 all\'intervallo, 2-1 alla fine', k:'Tempo con più gol: 1º' },
      { n:pc(secondo), t:'Più gol nel 2º tempo', s:'Es. 0-0 all\'intervallo, 2-1 alla fine', k:'Tempo con più gol: 2º' },
      { n:100 - pc(primo) - pc(secondo), t:'Stessi gol nei due tempi', s:'Es. 1-0 all\'intervallo, 1-1 alla fine', k:'Tempo con più gol: X' },
      { n:pc(T((i,j) => i + j === 0)), t:'0-0 all\'intervallo', s:'Nessun gol nei primi 45\'', k:'' }
    ]});
    categorie.push({ nome:'Parziale/finale', spiega:'<b>Come sta all\'intervallo / come finisce.</b> Es. X/1 = pari all\'intervallo, poi vince ' + e(a) + '. I 9 casi fanno 100%.',
      voci: Object.entries(pf).sort((x, y) => y[1] - x[1]).map(([c, p]) => ({ n: pc(p), t: `All'intervallo ${chi(c[0])}`, s: `Alla fine ${vince(c[2])}`, k: c })) });
  }

  // Risultato esatto: i 6 punteggi più probabili
  const esatti = [];
  for (let i = 0; i <= 5; i++) for (let j = 0; j <= 5; j++) esatti.push({ i, j, p: P((x, y) => x === i && y === j) });
  esatti.sort((x, y) => y.p - x.p);
  categorie.push({ nome:'Risultato esatto', esatto:true, spiega:'<b>Il punteggio preciso alla fine.</b> Sono i 6 più probabili: per questo la somma non fa 100%.',
    voci: esatti.slice(0, 6).map((x, n) => ({ n: pc(x.p), t: `${x.i} – ${x.j}`, s: n === 0 ? 'Il più probabile' : '' })) });

  // Le due squadre in stagione
  const tutte = id => fin.filter(p => p.casa.id === id || p.fuori.id === id).sort((x, y) => x.data < y.data ? -1 : 1);
  const fatti = (id, p) => p.casa.id === id ? p.finale[0] : p.finale[1];
  const subiti = (id, p) => p.casa.id === id ? p.finale[1] : p.finale[0];
  const riga = id => (D.classifica || []).find(r => r.id === id);
  const num = x => x.toFixed(1).replace('.', ',');
  const su = (l, f) => [l.filter(f).length, l.length];
  const cA = riga(A.id), cB = riga(B.id);
  const vA = su(hA, p => p.finale[0] > p.finale[1]), vB = su(aB, p => p.finale[1] > p.finale[0]);
  const zA = su(hA, p => p.finale[1] === 0), zB = su(aB, p => p.finale[0] === 0);
  const gA = su(hA, p => p.finale[0] + p.finale[1] >= 3), gB = su(aB, p => p.finale[0] + p.finale[1] >= 3);
  const frazione = ([x, n]) => n ? x / n : 0, testo = ([x, n]) => `${x} su ${n}`;
  const confronto = [
    ...(cA && cB ? [['Punti in classifica', cA.punti, cB.punti, `${cA.punti} · ${cA.pos}º`, `${cB.punti} · ${cB.pos}º`]] : []),
    ['Gol fatti a partita', media(tutte(A.id), p => fatti(A.id, p)), media(tutte(B.id), p => fatti(B.id, p))],
    ['Gol subiti a partita', media(tutte(A.id), p => subiti(A.id, p)), media(tutte(B.id), p => subiti(B.id, p))],
    ['Vittorie (in casa / fuori)', frazione(vA), frazione(vB), testo(vA), testo(vB)],
    ['Partite senza prendere gol', frazione(zA), frazione(zB), testo(zA), testo(zB)],
    ['Partite con 3+ gol in totale', frazione(gA), frazione(gB), testo(gA), testo(gB)]
  ].map(([n, x, y, tx, ty]) => [n, x, y, tx ?? num(x), ty ?? num(y)]);

  const esito = (id, p) => { const f = fatti(id, p), s = subiti(id, p); return f > s ? 'V' : f === s ? 'P' : 'S'; };
  const forma = { casa: tutte(A.id).slice(-5).map(p => esito(A.id, p)), fuori: tutte(B.id).slice(-5).map(p => esito(B.id, p)) };

  return { p1:t[0], pX:t[1], p2:t[2], categorie, confronto, forma, giocate: fin.length,
    traLoro: fin.filter(p => (p.casa.id === A.id && p.fuori.id === B.id) || (p.casa.id === B.id && p.fuori.id === A.id)) };
}

  const d = new Date(iso), o = { timeZone: 'Europe/Rome' };

  const h = d.toLocaleTimeString('it-IT', { ...o, hour: '2-digit', minute: '2-digit' });
  return g.charAt(0).toUpperCase() + g.slice(1) + ' · ' + h;
};
const mese = iso => { const s = new Date(iso).toLocaleDateString('it-IT', { timeZone: 'Europe/Rome', month: 'short', year: 'numeric' }).replace(/\./g, ''); return s.charAt(0).toUpperCase() + s.slice(1); };
const ora = iso => new Date(iso).toLocaleTimeString('it-IT', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit' });

$('app').innerHTML = `

$('cerca').addEventListener('submit', ev => { ev.preventDefault(); cerca($('partita').value); });

function errore(msg, squadre, quale){
  $('scheda').innerHTML = `<div class="carta vuoto errore">${e(msg)}${squadre ? `<div class="nomi">${squadre.map(t => `<button type="button" data-n="${e(t.corto || t.nome)}">${e(t.corto || t.nome)}</button>`).join('')}</div>` : ''}</div>`;
  // tocco su un nome: corregge la squadra che non trovavo (o completa la partita) e cerca
  $('scheda').querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => {
    const parti = dividi($('partita').value), n = b.dataset.n;
    if (parti.length === 2 && quale != null) parti[quale] = n;
    else if (parti.length === 1) parti.push(n);
    else { $('partita').value = n + ' - '; $('partita').focus(); return; }
    $('partita').value = parti.join(' - ');
    cerca($('partita').value);
  }));
}

async function cerca(testo){
  const parti = dividi(testo);
  $('vai').disabled = true; $('vai').textContent = 'Cerco…';
  try {
    const D = await stagione();
    const squadre = squadreDi(D).sort((x, y) => String(x.corto || x.nome).localeCompare(String(y.corto || y.nome)));
    $('agg').hidden = false; $('agg').textContent = (D.vecchi ? 'Vecchi · ' : 'Dati delle ') + ora(D.aggiornato || new Date().toISOString());
    if (parti.length !== 2) return errore('Scrivi le due squadre separate da un trattino: prima chi gioca in casa. Es. Roma - Sassuolo. Squadre di Serie A:', squadre);
    let A = trova(parti[0], squadre), B = trova(parti[1], squadre);
    if (!A || !B) return errore(`Non trovo "${!A ? parti[0] : parti[1]}" in Serie A. Tocca un nome:`, squadre, !A ? 0 : 1);
    if (A.id === B.id) return errore('Hai scritto due volte la stessa squadra.', squadre);
    scrivi('calcio-ultima', testo);

    // la prossima partita in calendario tra le due (in qualsiasi ordine)
    const prossime = D.partite.filter(p => p.stato !== 'FINISHED' && ((p.casa.id === A.id && p.fuori.id === B.id) || (p.casa.id === B.id && p.fuori.id === A.id))).sort((x, y) => x.data < y.data ? -1 : 1);
    const match = prossime[0];
    let avviso = '';
    if (match && match.casa.id !== A.id){ [A, B] = [B, A]; avviso = `Si gioca in casa di ${A.corto || A.nome}: ho messo prima ${A.corto || A.nome}.`; }
    if (!match) avviso = 'Partita non in calendario: faccio i conti con ' + (A.corto || A.nome) + ' in casa.';

    const R = analizza(D, A, B);
    let lista = match ? await diretti(match.id) : [];
    lista = lista.filter(p => p.stato === 'FINISHED' && [p.casa.id, p.fuori.id].includes(A.id) && [p.casa.id, p.fuori.id].includes(B.id));
    if (!lista.length) lista = R.traLoro;
    lista = lista.sort((x, y) => x.data < y.data ? 1 : -1).slice(0, 5);
    mostra(A, B, match, R, lista, avviso);
  } catch (err) {
    errore(err.message);
  } finally {
    $('vai').disabled = false; $('vai').textContent = 'Cerca';
  }
}

function mostra(A, B, match, R, lista, avviso){
  const a = A.corto || A.nome, b = B.corto || B.nome;
  const max = Math.max(R.p1, R.pX, R.p2);
  const cella = (l, chi, n) => `<div class="${n === max ? 'top1' : ''}"><b>${n}%</b>${l} · ${e(chi)}</div>`;
  $('scheda').innerHTML = `
    <button class="indietro" id="indietro">‹ Tutte le partite</button>
    ${avviso ? `<p class="avviso">${e(avviso)}</p>` : ''}
    <div class="testa">
      <div class="info">${match ? `Serie A · ${e(match.giornata)}ª giornata` : 'Serie A'}</div>
      <div class="squadre">
        <div class="sq serif">${e(a)}<small><span class="pt c"></span>in casa</small></div>
        <div class="vs">contro</div>
        <div class="sq serif">${e(b)}<small><span class="pt f"></span>fuori</small></div>
      </div>
      ${match ? `<div class="info">${e(quando(match.data))}${match.stadio ? ' · ' + e(match.stadio) : ''}</div>` : ''}
    </div>

    <div class="carta">
      <div class="lab">Chi vince</div>
      <div class="tre"><i class="c" style="flex:${R.p1}"></i><i class="x" style="flex:${R.pX}"></i><i class="f" style="flex:${R.p2}"></i></div>
      <div class="tre-num">${cella('1', a, R.p1)}${cella('X', 'pareggio', R.pX)}${cella('2', b, R.p2)}</div>
    </div>

    <div class="carta">
      <div class="lab">Scenari</div>
      <div class="cat" id="cat">${R.categorie.map((c, i) => `<button class="chip" data-i="${i}">${e(c.nome)}</button>`).join('')}</div>
      <div class="spiega" id="spiega"></div>
      <div class="griglia" id="griglia"></div>
      <p class="come">Come si legge: 62% vuol dire che quest'anno, in partite come questa, è successo circa 6 volte su 10.</p>
    </div>

    <div class="carta">
      <div class="lab">Le due squadre in stagione</div>
      <div class="intest"><div><span class="pt c"></span>${e(a)}</div><div>${e(b)}<span class="pt f" style="margin:0 0 0 6px"></span></div></div>
      ${R.confronto.map(([n, x, y, tx, ty]) => { const m = Math.max(x, y) || 1; return `
        <div class="specchio">
          <div class="v">${e(tx)}</div><div class="nome">${e(n)}</div><div class="v d">${e(ty)}</div>
          <div class="barre"><div><i class="c" style="width:${x / m * 100}%"></i></div><div><i class="f" style="width:${y / m * 100}%"></i></div></div>
        </div>`; }).join('')}
    </div>

    <div class="carta">
      <div class="lab">Ultime 5 (la più recente a destra)</div>
      ${[[a, R.forma.casa], [b, R.forma.fuori]].map(([chi, f]) => `
        <div class="forma"><span class="chi">${e(chi)}</span><div class="pallini">${f.map(r => `<span class="${r}">${r}</span>`).join('')}</div></div>`).join('')}
    </div>

    <div class="carta">
      <div class="lab">Scontri diretti</div>
      ${lista.length ? lista.map(p => `<div class="dir"><span class="t">${e(mese(p.data))}</span><span>${e(p.casa.corto || p.casa.nome)} – ${e(p.fuori.corto || p.fuori.nome)}</span><b>${e(p.finale[0])} – ${e(p.finale[1])}</b></div>`).join('')
        : '<div class="vuoto">Nessuno scontro diretto nei dati.</div>'}
    </div>

    <p class="nota">Le percentuali sono la storia, non il futuro: sono calcolate sulle ${R.giocate} partite di Serie A giocate quest'anno, senza infortuni, arbitro o motivazioni.</p>`;

  const scenari = i => {
    const c = R.categorie[i];
    $('cat').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', +x.dataset.i === i));
    $('spiega').innerHTML = c.spiega;   // testo scritto da noi; i nomi delle squadre sono già puliti con e()
    $('griglia').innerHTML = c.voci.map(p => c.esatto
      ? `<div class="q"><b>${e(p.t)}</b><span>${p.n}%</span>${p.s ? `<small>${e(p.s)}</small>` : ''}<div class="barretta"><i style="width:${Math.min(p.n * 3, 100)}%"></i></div></div>`
      : `<div class="q"><b>${p.n}%</b><span>${e(p.t)}</span><small>${e(p.s)}</small>${p.k ? `<em class="sigla">${e(p.k)}</em>` : ''}<div class="barretta"><i style="width:${p.n}%"></i></div></div>`
    ).join('');
  };
  $('cat').addEventListener('click', ev => { const x = ev.target.closest('.chip'); if (x) scenari(+x.dataset.i); });
  $('indietro').addEventListener('click', () => giornata(match ? match.giornata : null));
  window.scrollTo(0, 0);
  scenari(1);
}

// ---------- La giornata da toccare ----------
// Si apre sulla giornata in corso (la prima con partite ancora da giocare); ‹ › per le altre.
const giorno = iso => { const s = new Date(iso).toLocaleDateString('it-IT', { timeZone: 'Europe/Rome', weekday: 'long', day: 'numeric', month: 'long' }); return s.charAt(0).toUpperCase() + s.slice(1); };
async function giornata(n){
  try {
    const D = await stagione();
    $('agg').hidden = false; $('agg').textContent = (D.vecchi ? 'Vecchi · ' : 'Dati delle ') + ora(D.aggiornato || new Date().toISOString());
    const numeri = [...new Set(D.partite.map(p => p.giornata).filter(Boolean))].sort((x, y) => x - y);
    if (!numeri.length) throw new Error('Nessuna partita in calendario.');
    const aperta = D.partite.filter(p => p.stato !== 'FINISHED').map(p => p.giornata).sort((x, y) => x - y)[0];
    if (!numeri.includes(n)) n = aperta || numeri[numeri.length - 1];
    const lista = D.partite.filter(p => p.giornata === n).sort((x, y) => x.data < y.data ? -1 : 1);
    let html = '', ultimo = '';
    for (const p of lista){
      const g = giorno(p.data); if (g !== ultimo){ html += `<div class="giorno">${e(g)}</div>`; ultimo = g; }
      const a = p.casa.corto || p.casa.nome, b = p.fuori.corto || p.fuori.nome;
      let destra = '', barra = '';
      if (p.stato === 'FINISHED') destra = `<b>${e(p.finale[0])} – ${e(p.finale[1])}</b>`;
      else if (['IN_PLAY', 'PAUSED'].includes(p.stato)) destra = '<b>In corso</b>';
      // football-data a volte è in ritardo: se doveva essere finita da un pezzo, non mostro percentuali
      else if (Date.now() - new Date(p.data) > 2.5 * 3600 * 1000) destra = 'Risultato in arrivo';
      else {
        try {
          const R = analizza(D, p.casa, p.fuori), m = Math.max(R.p1, R.pX, R.p2);
          destra = `<b>${e(m === R.p1 ? a : m === R.p2 ? b : 'Pari')}</b> ${m}%`;
          barra = `<span class="tre"><i class="c" style="flex:${R.p1}"></i><i class="x" style="flex:${R.pX}"></i><i class="f" style="flex:${R.p2}"></i></span>`;
        } catch {}
      }
      html += `<button class="riga" data-p="${e(a + ' - ' + b)}"><span class="o">${p.stato === 'FINISHED' ? 'Finita' : e(ora(p.data))}</span><span><span class="n"><span>${e(a)} – ${e(b)}</span><em>${destra}</em></span>${barra}</span><span class="freccia">›</span></button>`;
    }
    const k = numeri.indexOf(n);
    $('scheda').innerHTML = `<div class="carta">
      <div class="gtesta"><button id="prima" aria-label="Giornata prima" ${k <= 0 ? 'disabled' : ''}>‹</button><div class="lab">Serie A · ${e(n)}ª giornata</div><button id="dopo" aria-label="Giornata dopo" ${k >= numeri.length - 1 ? 'disabled' : ''}>›</button></div>
      ${html}</div>
      <p class="nota">Tocca una partita per la scheda completa. La percentuale è l'esito più probabile.</p>`;
    $('prima').addEventListener('click', () => giornata(numeri[k - 1]));
    $('dopo').addEventListener('click', () => giornata(numeri[k + 1]));
    $('scheda').querySelectorAll('[data-p]').forEach(r => r.addEventListener('click', () => { $('partita').value = r.dataset.p; cerca(r.dataset.p); }));
  } catch (err) { errore(err.message); }
}

// All'apertura: la giornata in corso
giornata();
</script>
</body>
</html>
